<div class="page-header">
  <mat-icon class="page-icon">schedule</mat-icon>
  <h2>Schedules</h2>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search by slot name or route</mat-label>
  <input matInput [(ngModel)]="search" (ngModelChange)="filter()" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

@if (loading()) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="rows()" class="full-width">

      <ng-container matColumnDef="slotName">
        <th mat-header-cell *matHeaderCellDef>Slot</th>
        <td mat-cell *matCellDef="let r"><strong>{{ r.slotName }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="startTime">
        <th mat-header-cell *matHeaderCellDef>Departure</th>
        <td mat-cell *matCellDef="let r">{{ r.startTime }}</td>
      </ng-container>

      <ng-container matColumnDef="endTime">
        <th mat-header-cell *matHeaderCellDef>Arrival</th>
        <td mat-cell *matCellDef="let r">{{ r.endTime }}</td>
      </ng-container>

      <ng-container matColumnDef="routeId">
        <th mat-header-cell *matHeaderCellDef>Route</th>
        <td mat-cell *matCellDef="let r">{{ r.routeId }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">No schedules found.</td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>
