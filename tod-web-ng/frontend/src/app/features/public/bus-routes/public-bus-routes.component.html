<div class="page-header">
  <mat-icon class="page-icon">route</mat-icon>
  <h2>Bus Routes</h2>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search by route name or number</mat-label>
  <input matInput [(ngModel)]="search" (ngModelChange)="filter()" />
  <mat-icon matSuffix>search</mat-icon>
</mat-form-field>

@if (loading()) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<mat-card>
  <mat-card-content>
    <table mat-table [dataSource]="rows()" class="full-width">

      <ng-container matColumnDef="routeNo">
        <th mat-header-cell *matHeaderCellDef>Route No</th>
        <td mat-cell *matCellDef="let r"><strong>{{ r.routeNo }}</strong></td>
      </ng-container>

      <ng-container matColumnDef="routeName">
        <th mat-header-cell *matHeaderCellDef>Route Name</th>
        <td mat-cell *matCellDef="let r">{{ r.routeName }}</td>
      </ng-container>

      <ng-container matColumnDef="busType">
        <th mat-header-cell *matHeaderCellDef>Bus Type</th>
        <td mat-cell *matCellDef="let r">
          <mat-chip-set><mat-chip>{{ r.busType }}</mat-chip></mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="totalDistance">
        <th mat-header-cell *matHeaderCellDef>Distance</th>
        <td mat-cell *matCellDef="let r">{{ r.totalDistance }} km</td>
      </ng-container>

      <ng-container matColumnDef="avgTime">
        <th mat-header-cell *matHeaderCellDef>Avg Time</th>
        <td mat-cell *matCellDef="let r">{{ r.avgTime }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
          No routes found.
        </td>
      </tr>
    </table>
  </mat-card-content>
</mat-card>
