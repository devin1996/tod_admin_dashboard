<div class="page-header">
  <h2>Drivers</h2>
  <a mat-raised-button color="primary" routerLink="new"><mat-icon>add</mat-icon> Add Driver</a>
</div>
@if (loading()) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }
<mat-card><mat-card-content>
  <table mat-table [dataSource]="rows()" class="full-width">
    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef>First Name</th>
      <td mat-cell *matCellDef="let r">{{ r.firstName }}</td>
    </ng-container>
    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef>Last Name</th>
      <td mat-cell *matCellDef="let r">{{ r.lastName }}</td>
    </ng-container>
    <ng-container matColumnDef="licenseNo">
      <th mat-header-cell *matHeaderCellDef>License No</th>
      <td mat-cell *matCellDef="let r">{{ r.licenseNo }}</td>
    </ng-container>
    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let r">{{ r.phone }}</td>
    </ng-container>
    <ng-container matColumnDef="companyId">
      <th mat-header-cell *matHeaderCellDef>Company</th>
      <td mat-cell *matCellDef="let r">{{ r.companyId }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let r">
        <a mat-icon-button color="primary" [routerLink]="[r._key, 'edit']" matTooltip="Edit"><mat-icon>edit</mat-icon></a>
        <button mat-icon-button color="warn" (click)="confirmDelete(r)" matTooltip="Delete"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">No drivers found.</td>
    </tr>
  </table>
</mat-card-content></mat-card>
