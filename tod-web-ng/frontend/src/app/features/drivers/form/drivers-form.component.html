<div class="page-header">
  <a mat-icon-button routerLink="/drivers"><mat-icon>arrow_back</mat-icon></a>
  <h2>{{ editId() ? 'Edit Driver' : 'Add Driver' }}</h2>
</div>
@if (loading()) {
  <div class="center-spinner"><mat-spinner diameter="48"></mat-spinner></div>
} @else {
  <mat-card><mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>First Name</mat-label>
        <input matInput formControlName="firstName" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lastName" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>License No</mat-label>
        <input matInput formControlName="licenseNo" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Company ID</mat-label>
        <input matInput formControlName="companyId" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <div class="form-actions span-2">
        <a mat-stroked-button routerLink="/drivers">Cancel</a>
        <button mat-raised-button color="primary" type="submit" [disabled]="saving()">
          @if (saving()) { <mat-spinner diameter="18"></mat-spinner> } @else { {{ editId() ? 'Update' : 'Save' }} }
        </button>
      </div>
    </form>
  </mat-card-content></mat-card>
}
