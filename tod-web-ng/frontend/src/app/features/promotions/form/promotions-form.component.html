<div class="page-header">
  <a mat-icon-button routerLink="/promotions"><mat-icon>arrow_back</mat-icon></a>
  <h2>{{ editId() ? 'Edit Promotion' : 'Add Promotion' }}</h2>
</div>
@if (loading()) {
  <div class="center-spinner"><mat-spinner diameter="48"></mat-spinner></div>
} @else {
  <mat-card><mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="3"></textarea>
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Discount %</mat-label>
        <input matInput formControlName="discountPercent" type="number" min="1" max="100" />
        <mat-error>Enter a value between 1–100</mat-error>
      </mat-form-field>
      <div></div>
      <mat-form-field appearance="outline">
        <mat-label>Start Date</mat-label>
        <input matInput formControlName="startDate" type="date" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>End Date</mat-label>
        <input matInput formControlName="endDate" type="date" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <div class="span-2">
        <mat-checkbox formControlName="active">Active</mat-checkbox>
      </div>
      <div class="form-actions span-2">
        <a mat-stroked-button routerLink="/promotions">Cancel</a>
        <button mat-raised-button color="primary" type="submit" [disabled]="saving()">
          @if (saving()) { <mat-spinner diameter="18"></mat-spinner> } @else { {{ editId() ? 'Update' : 'Save' }} }
        </button>
      </div>
    </form>
  </mat-card-content></mat-card>
}
