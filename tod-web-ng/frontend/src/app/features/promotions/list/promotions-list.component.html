<div class="page-header">
  <h2>Promotions</h2>
  <a mat-raised-button color="primary" routerLink="new"><mat-icon>add</mat-icon> Add Promotion</a>
</div>
@if (loading()) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }
<mat-card><mat-card-content>
  <table mat-table [dataSource]="rows()" class="full-width">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let r">{{ r.title }}</td>
    </ng-container>
    <ng-container matColumnDef="discountPercent">
      <th mat-header-cell *matHeaderCellDef>Discount %</th>
      <td mat-cell *matCellDef="let r">{{ r.discountPercent }}%</td>
    </ng-container>
    <ng-container matColumnDef="startDate">
      <th mat-header-cell *matHeaderCellDef>Start</th>
      <td mat-cell *matCellDef="let r">{{ r.startDate }}</td>
    </ng-container>
    <ng-container matColumnDef="endDate">
      <th mat-header-cell *matHeaderCellDef>End</th>
      <td mat-cell *matCellDef="let r">{{ r.endDate }}</td>
    </ng-container>
    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let r">
        <mat-chip-set>
          <mat-chip [color]="r.active ? 'primary' : undefined" [highlighted]="r.active">
            {{ r.active ? 'Active' : 'Inactive' }}
          </mat-chip>
        </mat-chip-set>
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let r">
        <a mat-icon-button color="primary" [routerLink]="[r._key, 'edit']" matTooltip="Edit"><mat-icon>edit</mat-icon></a>
        <button mat-icon-button color="warn" (click)="confirmDelete(r)" matTooltip="Delete"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">No promotions found.</td>
    </tr>
  </table>
</mat-card-content></mat-card>
