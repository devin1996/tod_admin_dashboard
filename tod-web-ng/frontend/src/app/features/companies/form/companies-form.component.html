<div class="page-header">
  <a mat-icon-button routerLink="/companies"><mat-icon>arrow_back</mat-icon></a>
  <h2>{{ editId() ? 'Edit Company' : 'Add Company' }}</h2>
</div>
@if (loading()) {
  <div class="center-spinner"><mat-spinner diameter="48"></mat-spinner></div>
} @else {
  <mat-card><mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Company Name</mat-label>
        <input matInput formControlName="companyName" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Registration No</mat-label>
        <input matInput formControlName="regNo" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" />
        <mat-error>Valid email required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Address</mat-label>
        <textarea matInput formControlName="address" rows="2"></textarea>
        <mat-error>Required</mat-error>
      </mat-form-field>
      <div class="form-actions span-2">
        <a mat-stroked-button routerLink="/companies">Cancel</a>
        <button mat-raised-button color="primary" type="submit" [disabled]="saving()">
          @if (saving()) { <mat-spinner diameter="18"></mat-spinner> } @else { {{ editId() ? 'Update' : 'Save' }} }
        </button>
      </div>
    </form>
  </mat-card-content></mat-card>
}
