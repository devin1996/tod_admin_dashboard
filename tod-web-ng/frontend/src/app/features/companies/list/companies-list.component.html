<div class="page-header">
  <h2>Bus Companies</h2>
  <a mat-raised-button color="primary" routerLink="new"><mat-icon>add</mat-icon> Add Company</a>
</div>
@if (loading()) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }
<mat-card><mat-card-content>
  <table mat-table [dataSource]="rows()" class="full-width">
    <ng-container matColumnDef="companyName">
      <th mat-header-cell *matHeaderCellDef>Company Name</th>
      <td mat-cell *matCellDef="let r">{{ r.companyName }}</td>
    </ng-container>
    <ng-container matColumnDef="regNo">
      <th mat-header-cell *matHeaderCellDef>Reg No</th>
      <td mat-cell *matCellDef="let r">{{ r.regNo }}</td>
    </ng-container>
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let r">{{ r.email }}</td>
    </ng-container>
    <ng-container matColumnDef="phone">
      <th mat-header-cell *matHeaderCellDef>Phone</th>
      <td mat-cell *matCellDef="let r">{{ r.phone }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let r">
        <a mat-icon-button color="primary" [routerLink]="[r._key, 'edit']" matTooltip="Edit"><mat-icon>edit</mat-icon></a>
        <button mat-icon-button color="warn" (click)="confirmDelete(r)" matTooltip="Delete"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">No companies found.</td>
    </tr>
  </table>
</mat-card-content></mat-card>
