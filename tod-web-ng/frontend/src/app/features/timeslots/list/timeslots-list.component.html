<div class="page-header">
  <h2>Time Slots</h2>
  <a mat-raised-button color="primary" routerLink="new"><mat-icon>add</mat-icon> Add Slot</a>
</div>
@if (loading()) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }
<mat-card><mat-card-content>
  <table mat-table [dataSource]="rows()" class="full-width">
    <ng-container matColumnDef="slotName">
      <th mat-header-cell *matHeaderCellDef>Slot Name</th>
      <td mat-cell *matCellDef="let r">{{ r.slotName }}</td>
    </ng-container>
    <ng-container matColumnDef="startTime">
      <th mat-header-cell *matHeaderCellDef>Start Time</th>
      <td mat-cell *matCellDef="let r">{{ r.startTime }}</td>
    </ng-container>
    <ng-container matColumnDef="endTime">
      <th mat-header-cell *matHeaderCellDef>End Time</th>
      <td mat-cell *matCellDef="let r">{{ r.endTime }}</td>
    </ng-container>
    <ng-container matColumnDef="routeId">
      <th mat-header-cell *matHeaderCellDef>Route</th>
      <td mat-cell *matCellDef="let r">{{ r.routeId }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let r">
        <a mat-icon-button color="primary" [routerLink]="[r._key, 'edit']" matTooltip="Edit"><mat-icon>edit</mat-icon></a>
        <button mat-icon-button color="warn" (click)="confirmDelete(r)" matTooltip="Delete"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">No time slots found.</td>
    </tr>
  </table>
</mat-card-content></mat-card>
