<div class="page-header">
  <a mat-icon-button routerLink="/timeslots"><mat-icon>arrow_back</mat-icon></a>
  <h2>{{ editId() ? 'Edit Time Slot' : 'Add Time Slot' }}</h2>
</div>
@if (loading()) {
  <div class="center-spinner"><mat-spinner diameter="48"></mat-spinner></div>
} @else {
  <mat-card><mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Slot Name</mat-label>
        <input matInput formControlName="slotName" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Start Time</mat-label>
        <input matInput formControlName="startTime" type="time" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>End Time</mat-label>
        <input matInput formControlName="endTime" type="time" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="span-2">
        <mat-label>Route ID</mat-label>
        <input matInput formControlName="routeId" />
        <mat-error>Required</mat-error>
      </mat-form-field>
      <div class="form-actions span-2">
        <a mat-stroked-button routerLink="/timeslots">Cancel</a>
        <button mat-raised-button color="primary" type="submit" [disabled]="saving()">
          @if (saving()) { <mat-spinner diameter="18"></mat-spinner> } @else { {{ editId() ? 'Update' : 'Save' }} }
        </button>
      </div>
    </form>
  </mat-card-content></mat-card>
}
