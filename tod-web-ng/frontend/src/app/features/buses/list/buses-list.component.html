<div class="page-header">
  <h2>Buses</h2>
  <a mat-raised-button color="primary" routerLink="new"><mat-icon>add</mat-icon> Add Bus</a>
</div>
@if (loading()) { <mat-progress-bar mode="indeterminate"></mat-progress-bar> }
<mat-card><mat-card-content>
  <table mat-table [dataSource]="rows()" class="full-width">
    <ng-container matColumnDef="busRegNo">
      <th mat-header-cell *matHeaderCellDef>Reg No</th>
      <td mat-cell *matCellDef="let r">{{ r.busRegNo }}</td>
    </ng-container>
    <ng-container matColumnDef="busType">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let r"><mat-chip-set><mat-chip>{{ r.busType }}</mat-chip></mat-chip-set></td>
    </ng-container>
    <ng-container matColumnDef="capacity">
      <th mat-header-cell *matHeaderCellDef>Capacity</th>
      <td mat-cell *matCellDef="let r">{{ r.capacity }}</td>
    </ng-container>
    <ng-container matColumnDef="companyId">
      <th mat-header-cell *matHeaderCellDef>Company</th>
      <td mat-cell *matCellDef="let r">{{ r.companyId }}</td>
    </ng-container>
    <ng-container matColumnDef="routeId">
      <th mat-header-cell *matHeaderCellDef>Route</th>
      <td mat-cell *matCellDef="let r">{{ r.routeId }}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let r">
        <a mat-icon-button color="primary" [routerLink]="[r._key, 'edit']" matTooltip="Edit"><mat-icon>edit</mat-icon></a>
        <button mat-icon-button color="warn" (click)="confirmDelete(r)" matTooltip="Delete"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let r; columns: displayedColumns;"></tr>
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">No buses found.</td>
    </tr>
  </table>
</mat-card-content></mat-card>
